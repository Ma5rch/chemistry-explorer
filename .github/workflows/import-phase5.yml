name: Import Phase 5
on:
  push:
    paths:
      - phase5-source.zip.b64

permissions:
  contents: write

jobs:
  import-phase5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract Phase 5 project into repository root
        run: |
          base64 -d phase5-source.zip.b64 > /tmp/phase5.zip
          mkdir -p /tmp/phase5
          unzip -q /tmp/phase5.zip -d /tmp/phase5
          cp -a /tmp/phase5/chemistry-explorer/. .
          rm -f phase5-source.zip.b64
          rm -rf /tmp/phase5 /tmp/phase5.zip

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Phase 5 glycan model and builder"
            git push origin HEAD:main
          fi
